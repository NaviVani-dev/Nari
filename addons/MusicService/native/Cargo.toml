[package]
name = "music_service"
version = "0.1.0"
edition = "2021"

[lib]
name = "nari"
crate-type = ["cdylib"]

[workspace]
members = ["webview"]

[dependencies]
cpal = "0.18.2"
godot = { version = "0.5", features = ["api-4-7", "lazy-function-tables"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
lofty = "0.25.2"
md-5 = "0.11.0"
opus-rs = "0.1.33"
rand = "0.10.2"
rubato = "5.0.0"
realfft = "3.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
signalsmith-stretch = "0.1.3"
kakasi = "0.1"
deunicode = "1.6"
flate2 = "1"
serde_norway = "0.9"
symphonia = { version = "0.6.1", features = ["all"] }
ureq = "3"
mlua = { version = "0.12.1", features = ["lua54", "vendored", "serialize"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
base64 = "0.23"
aes-gcm = "0.10"
aes = "0.8"
ctr = "0.9"
cbc = "0.1"
blowfish = "0.9"
num-bigint = "0.4"
mdns-sd = { version = "0.21", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
ebur128 = "0.1.10"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
rustysynth = "1.3.7"
xmrs = "0.15.2"
xmrsplayer = "0.15.0"
material-colors = { version = "0.5.0", features = ["quantize"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
discord-rich-presence = "1.1"
notify = "8.2.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }
objc2-foundation = "0.3"
objc2-media-player = "0.3"
objc2-ui-kit = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
libloading = "0.8"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.25.1"
wry = { version = "0.57", features = ["devtools"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-media-player = "0.3"
security-framework = "3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Power", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security_Cryptography"] }

[build-dependencies]
cc = "1.4"
