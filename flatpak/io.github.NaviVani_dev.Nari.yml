app-id: io.github.NaviVani_dev.Nari
base: org.godotengine.godot.BaseApp
base-version: '4.7'
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm22
command: nari

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-music:ro
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --own-name=org.mpris.MediaPlayer2.Nari
  - --own-name=org.mpris.MediaPlayer2.Nari.*
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --filesystem=xdg-run/app/dev.vencord.Vesktop:create

modules:
  - name: dav1d
    buildsystem: meson
    config-opts:
      - --default-library=static
      - -Denable_tools=false
      - -Denable_tests=false
      - -Denable_examples=false
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.a
    sources:
      - type: archive
        url: https://downloads.videolan.org/pub/videolan/dav1d/1.5.4/dav1d-1.5.4.tar.xz
        sha256: 686616b7c69eb88d44459391ab25cac13b6647a3b288835c5784e71c1514a5c5

  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --enable-shared
      - --enable-small
      - --disable-programs
      - --disable-doc
      - --disable-debug
      - --disable-x86asm
      - --disable-gpl
      - --disable-nonfree
      - --disable-autodetect
      - --disable-everything
      - --disable-avdevice
      - --disable-avfilter
      - --disable-swresample
      - --disable-network
      - --disable-hwaccels
      - --disable-bzlib
      - --disable-iconv
      - --disable-lzma
      - --disable-zlib
      - --enable-avcodec
      - --enable-avformat
      - --enable-avutil
      - --enable-swscale
      - --enable-protocol=file
      - --enable-demuxer=mov
      - --enable-demuxer=matroska
      - --enable-parser=h264
      - --enable-parser=hevc
      - --enable-parser=mpeg4video
      - --enable-parser=vp8
      - --enable-parser=vp9
      - --enable-parser=av1
      - --enable-decoder=h264
      - --enable-decoder=hevc
      - --enable-decoder=mpeg4
      - --enable-decoder=vp8
      - --enable-decoder=vp9
      - --enable-decoder=av1
      - --enable-libdav1d
      - --enable-decoder=libdav1d
      - --pkg-config-flags=--static
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.0.1.tar.xz
        sha256: 05ee0b03119b45c0bdb4df654b96802e909e0a752f72e4fe3794f487229e5a41

  - name: nari
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
      env:
        CARGO_HOME: /run/build/nari/cargo
        LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
        FFMPEG_DIR: /app
    sources:
      - type: git
        url: https://github.com/NaviVani-dev/Nari.git
        tag: v1.1.0
      - cargo-sources.json
      - type: archive
        url: https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-0.8.9+release.makefile.tar.gz
        sha256: 9273b88b67973cc69e54d748ab1b749399d6d07695f1c37d0c59f88b4106074f
        dest: addons/MusicService/.build/libopenmpt
      - type: file
        url: https://github.com/NaviVani-dev/Nari/releases/download/v1.1.0/Nari.pck
        sha256: 0395eb89aa84d362cc0b7102d137f81f10db5ca702924695ab1e853a0ff99250
      - type: script
        dest-filename: nari.sh
        commands:
          - exec /app/bin/godot-runner --main-pack /app/share/nari/Nari.pck "$@"
    build-commands:
      - cargo --offline build --release --workspace --manifest-path addons/MusicService/native/Cargo.toml
      - install -Dm644 addons/MusicService/native/target/release/libnari.so addons/MusicService/native/target/release/libnari_webview.so -t /app/lib/
      - install -Dm644 Nari.pck -t /app/share/nari/
      - install -Dm755 nari.sh /app/bin/nari
      - install -Dm644 metadata/icon.png /app/share/icons/hicolor/512x512/apps/io.github.NaviVani_dev.Nari.png
      - install -Dm644 flatpak/io.github.NaviVani_dev.Nari.desktop -t /app/share/applications/
      - install -Dm644 flatpak/io.github.NaviVani_dev.Nari.metainfo.xml -t /app/share/metainfo/
